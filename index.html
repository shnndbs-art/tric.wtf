<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tric.wtf</title>
<meta name="description" content="tric.wtf">

<!-- Open Graph (personalizza in config.js) -->
<meta property="og:title" content="tric.wtf">
<meta property="og:description" content="welcome to my page">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ff2e6d">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- overlay CRT / scanline / grain -->
<div class="crt-overlay" aria-hidden="true"></div>
<div class="grid-bg" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- click-to-enter gate: browser richiede interazione per audio -->
<div id="gate" class="gate">
  <div class="gate-inner">
    <div class="gate-glitch" data-text="tric.wtf">tric.wtf</div>
    <div class="gate-sub">clicca per entrare</div>
  </div>
</div>

<main class="wrap" id="main" hidden>

  <div class="viewcount" id="viewcount">
    <span class="dot"></span>
    <span id="viewcount-num">0</span> visite
  </div>

  <section class="card">

    <div class="avatar-ring">
      <img id="avatar" class="avatar" src="" alt="avatar">
    </div>

    <h1 class="username glitch" id="username" data-text="tric">tric</h1>
    <p class="tagline" id="tagline">edit config.js to make this yours</p>

    <div class="badges" id="badges"></div>

    <nav class="links" id="links" aria-label="social links"></nav>

    <footer class="footer">
      <a href="https://tric.wtf" class="brand-link">tric.wtf</a>
    </footer>

  </section>

</main>

<!-- music player -->
<div class="player" id="player" hidden>
  <button id="playBtn" class="play-btn" aria-label="play/pausa musica">
    <svg id="iconPlay" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
    <svg id="iconPause" viewBox="0 0 24 24" width="18" height="18" hidden><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <div class="player-meta">
    <div class="player-title" id="trackTitle">track</div>
    <div class="player-bar"><div class="player-bar-fill" id="playerFill"></div></div>
  </div>
  <button id="muteBtn" class="mute-btn" aria-label="muto">
    <svg id="iconVolOn" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
    <svg id="iconVolOff" viewBox="0 0 24 24" width="16" height="16" hidden><path fill="currentColor" d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.45 2.45c.03-.2.05-.43.05-.65zM19 12c0 .94-.2 1.82-.54 2.63l1.51 1.51A8.9 8.9 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
  </button>
  <audio id="audio" loop></audio>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
